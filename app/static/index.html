<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTD Winch Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
        }

        .container {
            width: min(760px, 92vw);
            margin: 0 auto;
            padding: 32px 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 28px;
        }

        .panel {
            background: #1E293B;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .connection-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
        }

        .connected {
            color: #22C55E;
            font-weight: bold;
        }

        .disconnected {
            color: #EF4444;
            font-weight: bold;
        }

        .secondary {
            color: #94A3B8;
        }

        .status-panel {
            text-align: center;
        }

        .status-small {
            color: #94A3B8;
            font-size: 13px;
            font-weight: bold;
        }

        #status {
            font-size: 40px;
            font-weight: bold;
            margin: 8px 0 4px;
        }

        #direction-text {
            color: #94A3B8;
        }

        #rpm {
            font-size: 22px;
            font-weight: bold;
            margin-top: 12px;
        }

        #speed-text {
            margin-top: 8px;
            color: #94A3B8;
        }

        .speed-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }

        .speed-block {
            width: 52px;
            padding: 9px 0;
            text-align: center;
            border-radius: 7px;
            background: #334155;
            color: #94A3B8;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 0.8fr 1fr;
            gap: 14px;
        }

        button {
            border: none;
            border-radius: 12px;
            min-height: 125px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .retract {
            background: #22C55E;
        }

        .stop {
            background: #EF4444;
        }

        .deploy {
            background: #3B82F6;
        }

        .button-symbol {
            display: block;
            font-size: 34px;
            margin-bottom: 12px;
        }

        .footer {
            text-align: center;
            color: #94A3B8;
            font-size: 14px;
            margin-top: 22px;
            line-height: 1.8;
        }

        .error {
            margin-top: 16px;
            color: #FCA5A5;
            text-align: center;
            min-height: 20px;
        }

        @media (max-width: 620px) {
            .controls {
                grid-template-columns: 1fr;
            }

            button {
                min-height: 95px;
            }

            .connection-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CTD WINCH CONTROL</h1>
    <div class="subtitle">
        BlueBoat • Dynamixel XW540-T140-R
    </div>

    <div class="panel">
        <div class="connection-row">
            <div id="connection" class="disconnected">
                ● DISCONNECTED
            </div>

            <div class="secondary">
                Motor ID 7 • /dev/ttyUSB0 • 1 Mbps
            </div>
        </div>
    </div>

    <div class="panel status-panel">
        <div class="status-small">
            WINCH STATUS
        </div>

        <div id="status">
            STOPPED
        </div>

        <div id="direction-text">
            Cable stationary
        </div>

        <div id="rpm">
            0.0 RPM
        </div>

        <div id="speed-text">
            Speed level: 0 / 5
        </div>

        <div class="speed-indicator">
            <div class="speed-block">1</div>
            <div class="speed-block">2</div>
            <div class="speed-block">3</div>
            <div class="speed-block">4</div>
            <div class="speed-block">5</div>
        </div>
    </div>

    <div class="controls">

        <button class="retract" onclick="sendCommand('retract')">
            <span class="button-symbol">▲</span>
            RETRACT / FASTER
        </button>

        <button class="stop" onclick="sendCommand('stop')">
            <span class="button-symbol">■</span>
            STOP
        </button>

        <button class="deploy" onclick="sendCommand('deploy')">
            <span class="button-symbol">▼</span>
            DEPLOY / FASTER
        </button>

    </div>

    <div id="error" class="error"></div>

    <div class="footer">
        ↑ Retract / faster &nbsp;&nbsp;
        ↓ Deploy / faster &nbsp;&nbsp;
        SPACE Stop
        <br>
        Speed range: 4.6 – 22.9 RPM
    </div>

</div>

<script>
    const speedBlocks = document.querySelectorAll(".speed-block");

    async function apiRequest(path, method = "GET") {
        const response = await fetch(path, {
            method: method
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();
    }


    function updateState(data) {
        const status = document.getElementById("status");
        const directionText = document.getElementById("direction-text");
        const rpm = document.getElementById("rpm");
        const speedText = document.getElementById("speed-text");

        speedBlocks.forEach(block => {
            block.style.background = "#334155";
            block.style.color = "#94A3B8";
        });

        if (data.status === "retracting") {
            status.textContent = "RETRACTING";
            status.style.color = "#22C55E";
            directionText.textContent = "Cable moving up";

        } else if (data.status === "deploying") {
            status.textContent = "DEPLOYING";
            status.style.color = "#3B82F6";
            directionText.textContent = "Cable moving down";

        } else {
            status.textContent = "STOPPED";
            status.style.color = "#EF4444";
            directionText.textContent = "Cable stationary";
        }

        rpm.textContent = `${data.rpm.toFixed(1)} RPM`;

        speedText.textContent =
            `Speed level: ${data.speed_level} / ${data.max_speed_level}`;

        for (let i = 0; i < data.speed_level; i++) {
            if (data.status === "retracting") {
                speedBlocks[i].style.background = "#22C55E";
            } else if (data.status === "deploying") {
                speedBlocks[i].style.background = "#3B82F6";
            }

            speedBlocks[i].style.color = "#F8FAFC";
        }
    }


    async function refreshState() {
        try {
            const data = await apiRequest("/motor/state");

            if (data.success) {
                updateState(data);
            }

        } catch (error) {
            document.getElementById("error").textContent =
                `State error: ${error.message}`;
        }
    }


    async function checkConnection() {
        const connection = document.getElementById("connection");

        try {
            const data = await apiRequest("/motor/ping");

            if (data.connected) {
                connection.textContent = "● CONNECTED";
                connection.className = "connected";
            } else {
                connection.textContent = "● DISCONNECTED";
                connection.className = "disconnected";
            }

        } catch (error) {
            connection.textContent = "● DISCONNECTED";
            connection.className = "disconnected";
        }
    }


    async function sendCommand(command) {
        document.getElementById("error").textContent = "";

        try {
            const data = await apiRequest(
                `/motor/${command}`,
                "POST"
            );

            if (!data.success) {
                throw new Error(data.error || "Command failed");
            }

            updateState(data);

        } catch (error) {
            document.getElementById("error").textContent =
                `Command error: ${error.message}`;
        }
    }


    document.addEventListener("keydown", event => {

        if (event.repeat) {
            return;
        }

        if (event.key === "ArrowUp") {
            event.preventDefault();
            sendCommand("retract");

        } else if (event.key === "ArrowDown") {
            event.preventDefault();
            sendCommand("deploy");

        } else if (event.code === "Space") {
            event.preventDefault();
            sendCommand("stop");
        }
    });


    async function initializeInterface() {
        await checkConnection();
        await refreshState();
    }


    initializeInterface();

    setInterval(refreshState, 1000);
    setInterval(checkConnection, 3000);
</script>

</body>
</html>
