[project]
name = "winch-control"
version = "0.1.0"
description = "BlueOS winch control extension"

dependencies = [
    "requests",
    "litestar",
    "uvicorn",
    "dynamixel-sdk",
    "pymavlink",
]

[tool.setuptools]
py-modules = [
    "config",
    "control",
    "ctd_auto_validation",
    "ctd_command_ownership",
    "ctd_encoder_feedback",
    "ctd_gps_fix",
    "ctd_lifecycle",
    "ctd_live_preview",
    "ctd_measured_velocity",
    "ctd_mission",
    "ctd_observation",
    "ctd_orchestrator",
    "ctd_readiness",
    "ctd_simulation",
    "ctd_supervised_motion",
    "ctd_terminal_rehearsal",
    "depth_control",
    "main",
    "mavlink_bridge",
    "mission_audit",
    "motor_bus",
    "retract_safety",
    "state",
]
